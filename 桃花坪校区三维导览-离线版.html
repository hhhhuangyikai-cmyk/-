eedback-toggle{display:block;width:100%;margin-top:15px;padding:8px;border:1px dashed #b9cec5;border-radius:8px;background:transparent;color:#427461;font-size:11px;cursor:pointer}.feedback-form{display:none;margin-top:8px;padding:10px;border-radius:9px;background:#f7faf6}.feedback-form.open{display:block}.feedback-form b{font-size:12px}.feedback-form p{margin:3px 0 7px;color:#71877d;font-size:10px;line-height:1.45}.feedback-form select,.feedback-form textarea,.feedback-form input{width:100%;margin-top:6px;border:1px solid #dce6da;border-radius:7px;padding:7px;background:#fff;font:11px Arial}.feedback-form textarea{min-height:48px;resize:vertical}.feedback-form .submit{background:#35735c}.feedback-status{margin:7px 0 0;text-align:center;color:#4e836c;font-size:10px}.notice{margin:9px 0 0;text-align:center;color:#8a9b92;font-size:9px}.hint{bottom:12px;left:50%;transform:translateX(-50%);padding:6px 10px;border-radius:14px;background:#fffdf5b8;color:#4c6c60;font-size:10px;white-space:nowrap;pointer-events:none}

<body>
  <iframe id="model" src="./附属文件/model/桃花坪校区3D模型.html" title="桃花坪校区真实白模"></iframe>
  <header class="bar"><div class="brand"><b>桃花坪校区新生导览</b></div><nav class="filters" id="filters" aria-label="地点分类"></nav><a class="admin-link" id="admin-link" href="#admin">管理员</a><button class="search" id="search-button" type="button">⌕ 搜索地点或建筑</button></header><section class="search-box" id="search-box" aria-label="搜索地点"><input id="search-input" type="search" autocomplete="off" placeholder="搜索快递、超市、体育馆入口…"><div class="search-results" id="search-results"></div></section>

  <section class="admin-overlay" id="admin-overlay" aria-label="离线管理员后台"><div class="admin-dialog"><header class="admin-head"><div><h2>离线管理员后台</h2><p>审核本机浏览器中保存的评价和地点纠错。</p></div><button class="admin-close" id="admin-close" type="button">×</button></header><form class="admin-login" id="admin-login"><label>管理员账号<input id="admin-account" value="admin" autocomplete="username"></label><label>密码<input id="admin-password" type="password" autocomplete="current-password"></label><button class="submit" type="submit">进入审核后台</button><p class="feedback-status" id="admin-status"></p></form><div class="admin-dashboard" id="admin-dashboard"><button class="admin-logout" id="admin-logout" type="button">退出管理员</button><section class="admin-section"><h3>待审核体验评价 <span id="pending-review-total"></span></h3><div id="pending-review-list"></div></section><section class="admin-section"><h3>待处理地点纠错 <span id="pending-feedback-total"></span></h3><div id="pending-feedback-list"></div></section></div></div></section>

  <script>
    const places=[
      {name:'菜鸟驿站',cat:'快递寄取',where:'树达教学楼旁',desc:'新生最常用的寄取快递点，可领取包裹和办理寄件。',photo:'./附属文件/model/菜鸟驿站.jpg'},
      {name:'拼多多驿站',cat:'快递寄取',where:'教职工宿舍区',desc:'靠近宿舍区的快递服务点，取件高峰请错峰前往。',photo:'./附属文件/model/拼多多驿站.jpg'},
      {name:'旺旺超市',cat:'生活服务',where:'8号宿舍附近',desc:'日用品、零食和饮料补给站，适合刚到校时采购生活用品。',photo:'./附属文件/model/旺旺超市.jpg'},
      {name:'壹号打印店',cat:'打印复印',where:'教职工宿舍区',desc:'提供打印、复印、扫描和证件照等服务。',photo:'./附属文件/model/壹号打印店.jpg'},
      {name:'蜜雪冰城',cat:'餐饮饮品',where:'食堂旁',desc:'食堂旁的饮品店，是新生集合和休息时容易找到的地标。',photo:'./附属文件/model/蜜雪冰城.jpg'},
      {name:'文创店',cat:'生活服务',where:'食堂附近',desc:'提供校园文创、小礼品等服务，适合购买纪念品和日常小物。',photo:'./附属文件/model/文创.jpg'},
      {name:'体育馆入口',cat:'生活服务',where:'16号宿舍地下',desc:'16号宿舍地下的体育用房入口，可由此进入体育活动空间。',photo:'./附属文件/model/体育馆入口.jpg'},
      {name:'圆通·拼多多驿站',cat:'快递寄取',where:'教工1栋107 印佳图文',desc:'位于教工1栋107的圆通、拼多多快递服务点，可办理包裹寄取。',photo:'./附属文件/model/印佳图文.jpg'},
      {name:'禾心优选·悦享自售',cat:'生活服务',where:'图书馆旁',desc:'图书馆旁的便利零售点，可购买饮品、零食和日常用品。',photo:'./附属文件/model/禾丰宜.jpg'}];
    const cats=['全部地点','快递寄取','生活服务','打印复印','餐饮饮品'], filters=document.querySelector('#filters'),list=document.querySelector('#list'),panel=document.querySelector('#panel'),searchBox=document.querySelector('#search-box'),searchInput=document.querySelector('#search-input'),searchResults=document.querySelector('#search-results');let active='全部地点',currentPlaceIndex=null,selectedRating=0;
    const reviewStorageKey='taohuaping-campus-reviews-v1';

    const pendingReviewStorageKey='taohuaping-campus-pending-reviews-v1';
    const isOnline=false;
    let reviewStore={};try{reviewStore=JSON.parse(localStorage.getItem(reviewStorageKey)||'{}')}catch(e){}

    const filterPoi={

    function applyFilter(){const ids=filterPoi[active];document.querySelector('#model').contentWindow?.postMessage({type:'campus-poi-filter',ids:ids? [...new Set([...basePoi,...ids])]:null},'*')}
    const categoryIcons={'全部地点':'<svg viewBox="0 0 32 32"><path d="M7 7h7v7H7zM18 7h7v7h-7zM7 18h7v7H7zM18 18h7v7h-7z"/></svg>','快递寄取':'<svg viewBox="0 0 32 32"><path d="M6 10l10-5 10 5v12l-10 5-10-5zM6 10l10 5 10-5M16 15v12"/></svg>','生活服务':'<svg viewBox="0 0 32 32"><path d="M6 12h20l-2 14H8zM11 12l2-5h6l2 5M12 18h8"/></svg>','打印复印':'<svg viewBox="0 0 32 32"><path d="M9 12V6h14v6M8 23H5v-9h22v9h-3M9 19h14v7H9zM23 17h.01"/></svg>','餐饮饮品':'<svg viewBox="0 0 32 32"><path d="M10 11h12l-1 15H11zM12 7h8M16 7V4M12 15h8M22 13h3a3 3 0 0 1 0 6h-3"/></svg>'};
    function render(){filters.innerHTML=cats.map(c=>`<button class="${c===active?'active':''}" onclick="active='${c}';render();applyFilter()"><span class="filter-icon">${categoryIcons[c]}</span>${c}</button>`).join('')}
    function escapeHtml(value){return value.replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}

    function closePanel(){panel.classList.remove('open');currentPlaceIndex=null;document.querySelector('#model').contentWindow?.postMessage({type:'campus-poi-clear'},'*')}
    const poiMap={'building-marker':0,'building-marker2':3,'building-marker3':2,'building-marker4':6,'building-marker5':4,'building-marker6':8,'building-marker7':5,'building-marker8':1,'building-marker9':7,'building-marker10':3};
    const placePoiMap=Object.fromEntries(Object.entries(poiMap).map(([id,index])=>[index,id]));let buildingNames=[];
    function clearBuildingHighlight(){document.querySelector('#model').contentWindow?.postMessage({type:'campus-building-clear'},'*')}
    function renderSearchResults(query=''){const keyword=query.trim().toLowerCase();const placeMatches=places.map((place,index)=>({place,index})).filter(({place})=>!keyword||[place.name,place.cat,place.where,place.desc].join(' ').toLowerCase().includes(keyword));const buildingMatches=buildingNames.filter(name=>!keyword||name.toLowerCase().includes(keyword));const serviceHtml=placeMatches.map(({place,index})=>`<button class="search-result" type="button" data-place-index="${index}"><b>${place.name}</b><span>${place.cat} · ${place.where}</span></button>`).join('');const buildingHtml=buildingMatches.map(name=>`<button class="search-result" type="button" data-building-name="${name}"><b>${name}</b><span>建筑 · 点击后在三维地图中高亮</span></button>`).join('');const buildingFirst=keyword&&buildingMatches.length&&placeMatches.length===0;searchResults.innerHTML=(serviceHtml||buildingHtml)?(buildingFirst?buildingHtml+serviceHtml:serviceHtml+buildingHtml):'<p class="search-empty">没有找到相关地点或建筑。</p>';searchResults.querySelectorAll('[data-place-index]').forEach(button=>button.addEventListener('click',()=>{const index=Number(button.dataset.placeIndex);const id=placePoiMap[index];clearBuildingHighlight();if(id)document.querySelector('#model').contentWindow?.postMessage({type:'campus-poi-select',id},'*');show(index);searchBox.classList.remove('open');document.querySelector('#search-button').focus()}));searchResults.querySelectorAll('[data-building-name]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('#model').contentWindow?.postMessage({type:'campus-building-select',name:button.dataset.buildingName},'*');panel.classList.remove('open');searchBox.classList.remove('open');document.querySelector('#search-button').focus()}))}
    window.addEventListener('message',event=>{if(event.data?.type==='campus-poi' && poiMap[event.data.id]!==undefined){clearBuildingHighlight();document.querySelector('#model').contentWindow?.postMessage({type:'campus-poi-select',id:event.data.id},'*');show(poiMap[event.data.id])}});
    window.addEventListener('message',event=>{if(event.data?.type==='campus-buildings'){buildingNames=[...new Set(event.data.names||[])];renderSearchResults(searchInput.value)}});
    window.addEventListener('message',event=>{if(event.data?.type==='campus-view'){document.querySelector('#cube').style.transform=`rotateX(${-event.data.pitch+18}deg) rotateY(${event.data.yaw}deg)`}});
    document.querySelector('#nav-cube').addEventListener('click',()=>document.querySelector('#model').contentWindow?.postMessage({type:'campus-reset-view'},'*'));
    document.querySelector('#search-button').addEventListener('click',()=>{const opening=!searchBox.classList.contains('open');searchBox.classList.toggle('open',opening);if(opening){searchInput.value='';renderSearchResults();searchInput.focus()}});
    searchInput.addEventListener('input',()=>renderSearchResults(searchInput.value));
    document.addEventListener('click',event=>{if(!searchBox.contains(event.target)&&!document.querySelector('#search-button').contains(event.target))searchBox.classList.remove('open')});
    document.addEventListener('keydown',event=>{if(event.key==='Escape')searchBox.classList.remove('open')});
    document.querySelector('#submit-review').addEventListener('click',()=>{const input=document.querySelector('#review-input'),text=input.value.trim();if(currentPlaceIndex===null||!text||!selectedRating){alert('请先选择星级并填写评价。');return}let pending=[];try{pending=JSON.parse(localStorage.getItem(pendingReviewStorageKey)||'[]')}catch(e){}pending.unshift({id:Date.now(),place:places[currentPlaceIndex].name,rating:selectedRating,text,date:new Date().toLocaleString('zh-CN')});localStorage.setItem(pendingReviewStorageKey,JSON.stringify(pending));input.value='';selectedRating=0;renderRatingPicker();alert('评价已提交，等待管理员审核。')});
    document.querySelector('#feedback-toggle').addEventListener('click',()=>document.querySelector('#feedback-form').classList.toggle('open'));
    document.querySelector('#submit-feedback').addEventListener('click',()=>{const text=document.querySelector('#feedback-text').value.trim(),type=document.querySelector('#feedback-type').value,contact=document.querySelector('#feedback-contact').value.trim();if(currentPlaceIndex===null||!text){alert('请填写需要修正的内容。');return}let feedback=[];try{feedback=JSON.parse(localStorage.getItem(feedbackStorageKey)||'[]')}catch(e){}feedback.unshift({id:Date.now(),place:places[currentPlaceIndex].name,type,text,contact,date:new Date().toLocaleString('zh-CN')});localStorage.setItem(feedbackStorageKey,JSON.stringify(feedback));document.querySelector('#feedback-text').value='';document.querySelector('#feedback-contact').value='';document.querySelector('#feedback-status').textContent='已提交，等待管理员处理。'});
    const adminOverlay=document.querySelector('#admin-overlay'),adminLogin=document.querySelector('#admin-login'),adminDashboard=document.querySelector('#admin-dashboard');
    function readLocalList(key){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return[]}}
    function renderAdmin(){
      const pending=readLocalList(pendingReviewStorageKey),feedback=readLocalList(feedbackStorageKey);
      document.querySelector('#pending-review-total').textContent=`(${pending.length})`;
      document.querySelector('#pending-feedback-total').textContent=`(${feedback.length})`;
      document.querySelector('#pending-review-list').innerHTML=pending.length?pending.map(item=>`<article class="admin-item"><div><b>${escapeHtml(item.place)}</b><small>${'★'.repeat(item.rating)}${'☆'.repeat(5-item.rating)} · ${escapeHtml(item.date)}</small><p>${escapeHtml(item.text)}</p></div><div class="admin-actions"><button type="button" data-review-publish="${item.id}">发布</button><button type="button" class="danger" data-review-delete="${item.id}">删除</button></div></article>`).join(''):'<p class="admin-empty">暂时没有待审核评价。</p>';
      document.querySelector('#pending-feedback-list').innerHTML=feedback.length?feedback.map(item=>`<article class="admin-item"><div><b>${escapeHtml(item.place)} · ${escapeHtml(item.type)}</b><small>${escapeHtml(item.date)}${item.contact?` · ${escapeHtml(item.contact)}`:''}</small><p>${escapeHtml(item.text)}</p></div><div class="admin-actions"><button type="button" data-feedback-done="${item.id}">已处理</button><button type="button" class="danger" data-feedback-delete="${item.id}">删除</button></div></article>`).join(''):'<p class="admin-empty">暂时没有待处理纠错。</p>';
      document.querySelectorAll('[data-review-publish]').forEach(button=>button.addEventListener('click',()=>moderateReview(Number(button.dataset.reviewPublish),true)));
      document.querySelectorAll('[data-review-delete]').forEach(button=>button.addEventListener('click',()=>moderateReview(Number(button.dataset.reviewDelete),false)));
      document.querySelectorAll('[data-feedback-done],[data-feedback-delete]').forEach(button=>button.addEventListener('click',()=>removeFeedback(Number(button.dataset.feedbackDone||button.dataset.feedbackDelete))));
    }
    function moderateReview(id,publish){const pending=readLocalList(pendingReviewStorageKey),item=pending.find(review=>review.id===id);if(publish&&item){(reviewStore[item.place]??=[]).unshift({rating:item.rating,text:item.text,date:item.date});localStorage.setItem(reviewStorageKey,JSON.stringify(reviewStore));if(currentPlaceIndex!==null&&places[currentPlaceIndex].name===item.place)renderReviews(currentPlaceIndex)}localStorage.setItem(pendingReviewStorageKey,JSON.stringify(pending.filter(review=>review.id!==id)));renderAdmin()}
    function removeFeedback(id){const feedback=readLocalList(feedbackStorageKey);localStorage.setItem(feedbackStorageKey,JSON.stringify(feedback.filter(item=>item.id!==id)));renderAdmin()}
    function setAdminView(){const authenticated=sessionStorage.getItem('taohuaping-offline-admin')==='yes';adminLogin.style.display=authenticated?'none':'block';adminDashboard.classList.toggle('open',authenticated);if(authenticated)renderAdmin()}
    document.querySelector('#admin-link').addEventListener('click',event=>{event.preventDefault();adminOverlay.classList.add('open');setAdminView()});
    document.querySelector('#admin-close').addEventListener('click',()=>adminOverlay.classList.remove('open'));
    adminOverlay.addEventListener('click',event=>{if(event.target===adminOverlay)adminOverlay.classList.remove('open')});
    adminLogin.addEventListener('submit',event=>{event.preventDefault();const account=document.querySelector('#admin-account').value.trim(),password=document.querySelector('#admin-password').value;if(account==='admin'&&password==='123456'){sessionStorage.setItem('taohuaping-offline-admin','yes');document.querySelector('#admin-status').textContent='';document.querySelector('#admin-password').value='';setAdminView()}else{document.querySelector('#admin-status').textContent='账号或密码不正确。'}});
    document.querySelector('#admin-logout').addEventListener('click',()=>{sessionStorage.removeItem('taohuaping-offline-admin');setAdminView()});
    document.querySelector('#model').addEventListener('load',()=>{applyFilter();document.querySelector('#model').contentWindow?.postMessage({type:'campus-building-list-request'},'*')});
    render();
  </script>
</body>
</html>
